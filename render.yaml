# Render Blueprint: New → Blueprint → pick this repo.
services:
  - type: web
    name: studyforyou-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL        # mysql+pymysql://USER:PASSWORD@HOST:4000/DATABASE (TiDB Cloud)
        sync: false
      - key: JWT_SECRET
        generateValue: true
